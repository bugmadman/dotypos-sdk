grumphp:
    tasks:
        composer:
            strict: true
        composer_normalize:
            indent_size: 4
            indent_style: space
        securitychecker_composeraudit: ~
        phplint:
            exclude: ['vendor']
        phpcs:
            standard: []
        phpstan:
            memory_limit: "-1"
        rector:
            clear_cache: true
